'ph','Share photos on my profile')}<div class="row" style="margin-top:8px"><button class="b gh" onclick="exp()">Export my data</button><button class="b dn" onclick="del()">Delete account</button></div></div><div class="cd legal-account-links"><h3>Legal</h3><div class="row"><button class="lk" onclick="openLegal('privacy')">Privacy Policy</button><button class="lk" onclick="openLegal('terms')">Terms &amp; Conditions</button></div></div>${S.isModerator?'<div class="cd"><button class="b ac" onclick="S.tab=\'mod\';R()">Open moderator queue</button></div>':''}${devUI()}`}

function cand(){return S.bd.cur||null}async function nextM(){return getM()}async function getM(){if(S.bd.date)return toast('Your current introduction is still active.');try{const data=await FableBackend.createIntro(),invite=data.intro;if(!invite)return toast('No compatible introduction is available right now. Try again later.');S.bd.cur={id:invite.intro_id,n:invite.alias||'Campus connection',st:'new',shared:invite.shared_interests||[]};R()}catch(error){toast(error.message||'Could not find an introduction.')}}async function pass(){const current=S.bd.cur;if(!current?.id)return;try{await FableBackend.respondIntro(current.id,false);S.bd.cur=null;R();toast('Invitation passed.')}catch(error){toast(error.message||'Could not pass this invitation.')}}async function accept(){const current=S.bd.cur;if(!current?.id)return toast('This invitation has expired.');try{const data=await FableBackend.respondIntro(current.id,true),result=data.result;if(result?.status==='matched'){S.bd.date={id:result.conversation_id,n:result.matched_user,at:NOW(),cx:null};S.bd.cool=NOW()+3*864e5;S.bd.cur=null;await loadBackendData();toast('You both said yes. Your private chat is open.')}else{current.st='wait';toast('Your yes is recorded. We will open a chat if they also say yes.')}R()}catch(error){toast(error.message||'Could not record your answer.')}}function matched(){return loadBackendData()}async function endDate(mode){const date=S.bd.date;if(!date?.id)return;try{const result=await FableBackend.endDate(date.id,mode==='continue');const status=result.result?.status;if(status==='ended')toast('You both ended the date. The chat is removed.');else if(status==='continued')toast('The date continues.');else toast('Your request to end the date is recorded.');await loadBackendData();R()}catch(error){toast(error.message||'Could not update the date.')}}function askEnd(){const d=S.bd.date;if(!d)return;sheet(`<h2>End the date?</h2><p class="mu" style="margin:8px 0 12px">Ending takes both people. If the other person does not confirm within 24 hours, the chat closes.</p><button class="b dn" onclick="endDate('request');closeS()">Ask to end</button> <button class="b gh" onclick="closeS()">Keep the date</button>`)}function invUI(c){const o=c.shared||[];return `<div class="cd sq"><span class="tag">Blind introduction</span><h2 style="margin:8px 0 2px">Campus connection</h2><p class="mu">Identity stays private unless you both agree to continue.</p><p style="margin:8px 0">${o.length?`You share ${o.length} interests, including ${E(o[0])}.`:'A new person from your campus is ready to meet.'}</p><div class="row"><button class="b gh" onclick="pass()">Pass</button><button class="b ac" onclick="accept()">I’m interested</button></div></div>`}function dateUI(d){const p=d.profile||P.find(x=>x.id===d.memberId||x.n===d.n)||{},pending=d.cx,deadline=pending?Math.max(1,Math.ceil((pending.at+864e5-NOW())/36e5)):0;return `<div class="cd sq"><span class="tag v">Blind date is on</span><h2 style="margin:8px 0 2px">${E(p.firstName||p.n||'Campus connection')}</h2><p class="mu">${E(p.course||p.mj||'CU UP')} · ${E(p.age||'Adult student')}</p><div class="row" style="margin:8px 0">${(p.interests||p.int||[]).slice(0,6).map(x=>`<span class="tag">${E(x)}</span>`).join('')}</div><p class="mu">New introductions are paused for both of you until ${S.bd.cool?new Date(S.bd.cool).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'}):'this date ends'}.</p><div class="row" style="margin-top:10px"><button class="b ac" onclick="openChat('${E(d.id)}')">Open private chat</button><button class="b" onclick="toast('Voice and video calls are not configured yet.')">Call</button>${pending?'':`<button class="b gh" onclick="askEnd()">End this date</button>`}</div></div>${pending?(pending.by==='me'?`<div class="cd"><b>You asked to end the date</b><p class="mu">The other person has ${deadline}h to respond.</p><button class="b ac" onclick="endDate('continue')">Withdraw request</button></div>`:`<div class="cd"><b>The other person asked to end the date</b><p class="mu">You have ${deadline}h to answer.</p><div class="row"><button class="b dn" onclick="endDate('agree')">Agree to end</button><button class="b ac" onclick="endDate('continue')">Keep going</button></div></div>`):''}`}function blind(){const b=S.bd;$('#hd').innerHTML='<h1>Blind introductions</h1><p>Meet the person first, the profile later.</p>';let h;if(b.date)h=dateUI(b.date);else if(b.cur&&b.cur.st==='wait')h='<div class="cd sq"><h2>You said yes</h2><p class="mu">Waiting for the other person. Nothing is shared until you both say yes.</p></div>';else if(b.cur)h=invUI(b.cur);else h='<div class="cd sq"><h2>Ready for a surprise?</h2><p class="mu" style="margin:6px 0 10px">We’ll find a compatible adult student. A private chat opens only after both people say yes.</p><button class="b ac" onclick="getM()">Find an introduction</button></div>';$('#mn').innerHTML=h+'<details class="cd"><summary><b>How blind introductions work</b></summary><p class="mu" style="margin-top:8px">You may receive up to four invitations in a day. If you both say yes, a private chat opens. New invitations pause for three days for both of you. Either person can block or report the other.</p></details>'}function call(){toast('Voice and video calls are not configured yet.')}function tgC(b,a,z){const on=b.getAttribute('aria-pressed')!='true';b.setAttribute('aria-pressed',on);b.textContent=on?z:a}

function intentCompatible(a,b){const x=a.intentions||[],y=b.intentions||[];if(!x.length||!y.length)return true;if(S.df?.broaden)return true;const social=new Set(['New friends first','Just meeting people','Still figuring it out']),serious=new Set(['Looking for a long-term relationship','Open to something serious']);for(const one of x)for(const two of y){if(one===two)return true;if(social.has(one)&&social.has(two))return true;if(serious.has(one)&&serious.has(two))return true}return false}
function scoreP(p){const o=sharedInterests(p),major=courseMatch(p),year=p.year===S.profile.year||p.yr===S.profile.year,compatible=intentCompatible(S.profile,p),profile=(p.profileComplete||65)/100,repeat=(S.rx[p.n]||{}).v||0;const cats=new Set(o.map(x=>Object.keys(LIB).find(k=>LIB[k].includes(x))).filter(Boolean));const lifestyle=(p.pets||[]).some(x=>(S.profile.pets||[]).includes(x))?2:0;const drinks=S.profile.drinking!=='Prefer not to say'&&S.profile.drinking===p.drinking?1:0,smokes=S.profile.smoking!=='Prefer not to say'&&S.profile.smoking===p.smoking?1:0;const prompt=S.profile.prompts?.some(a=>p.prompts?.some(b=>a.prompt&&b.prompt===a.prompt))?1:0;const freshness=(Date.now()-new Date(p.createdAt).getTime()<14*864e5)?2:0;const sc=o.length*7+cats.size*2+(major?9:0)+(year?3:0)+(compatible?9:-25)+profile*5+lifestyle+drinks+smokes+prompt+freshness-Math.min(repeat,4)*2;return{o,evs:0,hob:o.length,cls:(major?9:0)+(year?3:0),val:compatible?9:0,sc}}

function filteredPeople(){let list=feed(),f=S.df||defaultFilters(),q=(S.search||'').trim().toLowerCase();list=list.filter(p=>{const text=[p.n,p.course,p.mj,p.year,p.yr,p.bio,p.flex,...(p.interests||p.int||[])].join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(p.age<f.ageMin||p.age>f.ageMax)return false;if(f.gender&&p.gender!==f.gender)return false;if(f.interestedIn&&!(p.datingPreferences||[]).includes(f.interestedIn))return false;if(f.course&&!String(p.course||p.mj).toLowerCase().includes(f.course.toLowerCase()))return false;if(f.year&&p.year!==f.year)return false;if(f.intention&&!(p.intentions||[]).includes(f.intention))return false;if(f.interest&&!sharedInterests(p).includes(f.interest))return false;if(f.pet&&!p.pets?.includes(f.pet))return false;if(f.drinking&&p.drinking!==f.drinking)return false;if(f.smoking&&p.smoking!==f.smoking)return false;if(p.profileComplete<(f.minComplete||0))return false;if(f.hasPhoto&&!p.photos?.length)return false;if(f.hasBio&&!p.bio)return false;if(f.hasPrompts&&!p.prompts?.some(x=>x.answer))return false;if(f.shared&&!sharedInterests(p).length)return false;if(f.newProfiles&&!p.nw)return false;return true});const sort=f.sort;if(sort==='shared')list.sort((a,b)=>sharedInterests(b).length-sharedInterests(a).length);if(sort==='newest')list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(sort==='complete')list.sort((a,b)=>b.profileComplete-a.profileComplete);if(sort==='random')list=shuf(list,S.seed+'discover'+day());return list}

function legalPrivacyContent(){return `<section><h2>About Fable</h2><p>Fable is a campus introduction and dating service for CU UP students. The service is designed for adult dating: discovery, interests, and blind introductions are limited to people who are at least 18 and have verified an eligible university email. Do not create an account for another person.</p></section><section><h2>Information Fable uses</h2><p>Fable stores the university email used to sign in; the profile details you submit (including age, gender, dating preferences, course, year, intentions, interests, optional lifestyle details, bio, prompts, and photos); your privacy settings; chats and message timestamps; introductions and interest decisions; blocks, reports, and correction requests; and the versions and time of your Terms and Privacy acceptance. Safety reports may include the last four messages you choose to submit.</p></section><section><h2>Why information is used</h2><p>Fable uses this information to verify student email, create and show profiles according to your settings, find mutually compatible introductions, operate private chats, apply blocks and safety restrictions, review reports and correction requests, and respond to data export or deletion requests. Fable does not currently include voice or video calling.</p></section><section><h2>Where information is stored and sent</h2><p>The application runs on Vercel. Account, profile, introduction, chat, and safety data are stored in the Supabase service connected to this project. Profile photos are held in a private storage bucket and are served with temporary links only where the app permits them. Sign-in codes are sent through the email delivery provider configured for Supabase. The site also requests fonts from Google Fonts. Other providers may process information as needed to operate these services; the operator should identify the configured providers and applicable terms before enabling sign-in.</p></section><section><h2>Visibility and security</h2><p>Your profile is shown only to eligible adults who pass Fable's compatibility rules. Course, year, and photo visibility follow the privacy controls in your account. Blind introductions hide profile identity until both people accept. Photos are shown in an active mutual connection only if photo sharing is enabled. Chats are private to their participants and are not end-to-end encrypted. Fable uses access controls and private photo storage, but no online service can promise perfect security.</p></section><section><h2>Retention, export, and deletion</h2><p>You can request an export or delete your account in the app. Account deletion removes the Fable account and its linked profile, settings, chats, and photos. Fable may retain limited information where required to address safety, security, or legal obligations; the responsible operator must define and disclose any such retention before launch. Ephemeral messages stop appearing after 24 hours and are removed during a later chat refresh. Other messages remain until the account or conversation is deleted under the service rules.</p></section><section><h2>Your choices and contact</h2><p>You can change profile visibility settings, block accounts, submit a report, request a correction, export your data, or delete your account. Privacy rights vary by location. For privacy requests, contact <strong>[Fable privacy contact — add before enabling sign-in]</strong>. Responsible operator: <strong>[Fable operator/legal entity — add before enabling sign-in]</strong>. Do not enable real-user sign-in until these details and the actual provider configuration have been reviewed.</p></section>`}
